name: Release mpToolSet

on:
  push:
    branches: [main]
    paths: [mpToolSet/**]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Write ShotGrid config
        run: |
          cat > mpToolSet/mpAnim/shotSub_config.json <<EOF
          {
            "site_url": "${{ secrets.SHOTGRID_SITE_URL }}",
            "script_name": "${{ secrets.SHOTGRID_SCRIPT_NAME }}",
            "api_key": "${{ secrets.SHOTGRID_API_KEY }}"
          }
          EOF

      - name: Zip mpToolSet
        run: zip -r mpToolSet.zip mpToolSet/

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: mpToolSet Latest
          body: Drag `install.py` into Maya to install or update.
          files: mpToolSet.zip
          make_latest: true
